[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repoguard-cli"
version = "1.0.0"
description = "A local Git repository inspector for staged secrets, oversized files and repository hygiene."
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Miguel Moscoso", email = "miguelmoscoso.devperu@gmail.com"}]
dependencies = []

[project.scripts]
repoguard = "repoguard.cli:main"

[project.urls]
Repository = "https://github.com/MIGUEL-MOSCOSO-DEV/repoguard"
Issues = "https://github.com/MIGUEL-MOSCOSO-DEV/repoguard/issues"

[tool.setuptools.packages.find]
include = ["repoguard*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
